<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>भाजीपाला माहिती</title>
<meta name="theme-color" content="#1f6f43">
<style>
:root{--g:#1f6f43;--ink:#1f2937;--mut:#6b7280;--line:#e6e1d2;--card:#fff;--acc:#ea580c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f3ec;color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:104px}
header{background:linear-gradient(135deg,#ffffff24,#0000 60%),var(--g);color:#fff;padding:18px 18px 22px;border-radius:0 0 28px 28px;box-shadow:0 8px 20px #0000002e}
header h1{margin:0;font-size:22px;font-weight:800}header small{display:block;opacity:.85;margin-top:3px;font-size:13px}
.pg{display:none;padding:8px 12px}.pg.on{display:block}.pg.on>*{animation:up .42s cubic-bezier(.2,.8,.2,1) both}
.pg.on>*:nth-child(2){animation-delay:.05s}.pg.on>*:nth-child(3){animation-delay:.1s}.pg.on>*:nth-child(n+4){animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h3{margin:18px 4px 8px;font-size:16px;font-weight:800}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 1px 2px #0000000d}
input,select{width:100%;padding:11px;font-size:16px;border:1px solid #d6d1c0;border-radius:12px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--g);outline-offset:1px}
button{font:inherit;font-weight:700;border-radius:12px;transition:transform .12s}button:active{transform:scale(.97)}
.p{width:100%;padding:13px;border:0;background:var(--g);color:#fff;font-size:16px;box-shadow:0 2px 6px #0000002e}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}.chips button{flex:0 0 auto;padding:8px 14px;border:1px solid var(--g);background:#fff;color:var(--g);font-size:14px}.chips button.on{background:var(--g);color:#fff}
.vr{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0ece0}.vr:last-child{border:0}
.vr .n{flex:1.3;min-width:0}.vr .n b{display:block}.vr .n small{color:var(--mut)}
.vr input{flex:.8;padding:8px;text-align:center}.vr .s{flex:.9;text-align:right;font-weight:800;color:var(--g)}
.up{color:#dc2626}.dn{color:#16a34a}
details.gc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--cc,#43a047);border-radius:16px;margin:8px 0;padding:12px;box-shadow:0 1px 2px #0000000d}
details.gc summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center}details.gc summary::-webkit-details-marker{display:none}
details.gc[open]{animation:pop .3s both}@keyframes pop{from{opacity:.6;transform:scale(.98)}to{opacity:1;transform:none}}
details.gc div,details.gc li{margin-top:8px}
.ge{font-size:24px}.cp{font-size:12px;padding:3px 8px;border-radius:10px;font-weight:700}.cp.g{background:#dcfce7;color:#166534}.cp.o{background:#fef3c7;color:#92400e}.cp.r{background:#fee2e2;color:#991b1b}
.note{background:#fff8e1;color:#6d4c00;border-radius:12px;padding:10px;font-size:13px;margin:8px 0}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;background:#fffffff2;border:1px solid var(--line);border-radius:26px;box-shadow:0 10px 28px #00000030;backdrop-filter:blur(10px);z-index:30}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border:0;background:transparent;color:var(--mut);font-size:12px}
nav button i{font-style:normal;font-size:22px;width:60px;height:32px;display:grid;place-items:center;border-radius:16px;transition:background .25s}
nav button.on{color:var(--g)}nav button.on i{background:#dcf1e4}
.gb{display:block;width:100%;padding:12px;margin:8px 0;border:1px solid var(--g);background:#fff;color:var(--g);font-size:16px}
.fs{position:absolute;right:14px;top:16px;display:flex;gap:6px}.fs button{border:0;background:#ffffff30;color:#fff;padding:6px 12px;font-size:14px}
.st{border:0;background:transparent;font-size:24px;padding:0 4px;color:#f59e0b;flex:0 0 auto}
#fab{position:fixed;right:10px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:21px;z-index:29;opacity:.93;box-shadow:0 6px 16px #ea580c55}
#fab.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.lg{display:block;width:100%;padding:18px;margin:10px 0;font-size:20px;border:2px solid var(--g);background:#fff;color:var(--g);border-radius:16px}.lg.on{background:var(--g);color:#fff}
nav button i{width:46px}nav button span{font-size:11px}
.sday{background:linear-gradient(135deg,#fff7ed,#fff);border-left:5px solid var(--acc)}
@media(prefers-color-scheme:dark){body{background:#0f1a14;color:#e8efe8}:root{--card:#16241b;--ink:#e8efe8;--mut:#9fb5a2;--line:#24382b}input,select{background:#16241b;border-color:#2f4636;color:#e8efe8}nav{background:#16241bf2}nav button.on i{background:#24402e}.chips button{background:#16241b}.vr{border-color:#24382b}.note{background:#3a3217;color:#f5e1a4}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>#offb{display:none;position:fixed;left:0;right:0;top:0;z-index:99;background:#b45309;color:#fff;text-align:center;font:600 13px system-ui,sans-serif;padding:6px}body.off #offb{display:block}</style>
</head>

<button class="p" data-k="o_share" onclick="oShare()"></button><button class="gb" data-k="o_dl" onclick="oDl()"></button><div id="om" style="font-size:13px;color:var(--mut)"></div></div>
</div>
<div id="p4" class="pg">

<button class="lg" onclick="setLang(0)">मराठी</button><button class="lg" onclick="setLang(1)">हिन्दी</button><button class="lg" onclick="setLang(2)">English</button>

<div class="box"><input id="cb" type="number" inputmode="decimal" data-p="cb" oninput="calc()" style="margin-bottom:8px"><div class="r"><input id="cw" type="number" inputmode="decimal" data-p="cw" value="5" oninput="calc()"><input id="cm" type="number" inputmode="decimal" data-p="cm" value="20" oninput="calc()"></div><div id="co" style="margin-top:8px"></div></div>

</div>
</div>

var WD=[["रविवार: कुटुंबाची मोठी खरेदी. कॉम्बो पॅक आणि होम डिलिव्हरी पुढे ठेवा.", "सोमवार: आठवड्याचा माल मागवा आणि \"नवीन माल\" बोर्ड लावा.", "मंगळवार: गर्दी कमी, त्यामुळे WhatsApp वर एक छोटी ऑफर टाका.", "बुधवार: हॉटेल/मेसचे ऑर्डर तपासा आणि पुढील दोन दिवसांचा अंदाज घ्या.", "गुरुवार: आठवड्याच्या शेवटासाठी पालेभाज्यांची तयारी करा.", "शुक्रवार: उद्याच्या शनिवारच्या गर्दीसाठी माल वाढवा.", "शनिवार: आठवडी खरेदी. संध्याकाळी क्लिअरन्स भाव ठरवा."], ["रविवार: परिवारों की बड़ी ख़रीद। कॉम्बो पैक और होम डिलीवरी आगे रखें।", "सोमवार: हफ़्ते का माल मँगवाएँ और \"नया माल\" का बोर्ड लगाएँ।", "मंगलवार: भीड़ कम, इसलिए WhatsApp पर एक छोटा ऑफ़र डालें।", "बुधवार: होटल/मेस के ऑर्डर जाँचें और अगले दो दिन का अंदाज़ा लें।", "गुरुवार: हफ़्ते के आख़िर के लिए पत्तेदार सब्ज़ियों की तैयारी करें।", "शुक्रवार: कल शनिवार की भीड़ के लिए माल बढ़ाएँ।", "शनिवार: हफ़्ते भर की ख़रीदारी। शाम को क्लियरेंस भाव तय करें।"], ["Sunday: big family shopping. Push combo packs and home delivery.", "Monday: order the week's stock and put up a \"new stock\" board.", "Tuesday: slow day, so post a small offer on WhatsApp.", "Wednesday: check hotel/mess orders and estimate the next two days.", "Thursday: prepare leafy vegetables for the weekend.", "Friday: increase stock for tomorrow's Saturday rush.", "Saturday: weekly shopping. Decide the evening clearance price."]];
var STR=[[["🌅 सकाळी ताजा भाव, 🌇 संध्याकाळी क्लिअरन्स", "सकाळी पूर्ण भाव ठेवा. संध्याकाळी उरलेला माल खरेदी भावाच्या थोडा वर विका आणि \"आजचा शेवटचा माल\" असा बोर्ड लावा. रात्री माल फेकण्यापेक्षा हे नेहमी फायद्याचं."], ["🌅 सुबह ताज़ा भाव, 🌇 शाम को क्लियरेंस", "सुबह पूरा भाव रखें। शाम को बचा माल ख़रीद भाव से थोड़ा ऊपर बेचें और \"आज का आख़िरी माल\" का बोर्ड लगाएँ। रात को माल फेंकने से यह हमेशा फ़ायदे का है।"], ["🌅 Fresh price in the morning, 🌇 clearance in the evening", "Keep the full price in the morning. In the evening sell leftovers slightly above cost and put up a \"last stock of the day\" board. This always beats throwing stock away at night."], "#fb8c00"], [["🧺 कॉम्बो पॅक", "₹५०, ₹१०० चे तयार पॅक करा (बटाटा+कांदा+टोमॅटो, किंवा आठवड्याची भाजी). ग्राहक जास्त घेतो आणि तुमचा हळू खपणारा माल निघतो."], ["🧺 कॉम्बो पैक", "आलू+प्याज़+टमाटर या हफ़्ते भर की सब्ज़ी के ₹५०, ₹१०० के तैयार पैक बनाएँ। ग्राहक ज़्यादा लेता है और धीमा बिकने वाला माल निकल जाता है।"], ["🧺 Combo packs", "Make ready ₹50 and ₹100 packs (potato+onion+tomato, or a week's vegetables). Customers buy more and slow-moving stock clears."], "#43a047"], [["📲 रोजचा WhatsApp भाव", "सकाळी ७ वाजता \"आजचे भाव\" एक मेसेज ग्रुपवर टाका. ऑर्डर आदल्या रात्री ९ पर्यंत घ्या. यामुळे अंदाजे खरेदी करता येते आणि नासाडी कमी होते."], ["📲 रोज़ का WhatsApp भाव", "सुबह ७ बजे ग्रुप पर \"आज के भाव\" का एक संदेश डालें। ऑर्डर पिछली रात ९ बजे तक लें। इससे अंदाज़े से ख़रीदी होती है और बर्बादी घटती है।"], ["📲 Daily WhatsApp rates", "Post one \"today's rates\" message on the group at 7 am. Take orders until 9 pm the night before. This lets you buy by estimate and cuts waste."], "#1e88e5"], [["🏪 हॉटेल / मेस रोजचा पुरवठा", "दोन-तीन हॉटेल किंवा मेस ठरवा. रोजचा ठरलेला ऑर्डर म्हणजे खात्रीचा खप. भाव थोडा कमी ठेवला तरी एकूण नफा वाढतो."], ["🏪 होटल / मेस की रोज़ाना सप्लाई", "दो-तीन होटल या मेस तय करें। रोज़ का तय ऑर्डर यानी पक्की बिक्री। भाव थोड़ा कम रखें तो भी कुल मुनाफ़ा बढ़ता है।"], ["🏪 Daily hotel / mess supply", "Fix two or three hotels or messes. A fixed daily order means sure sales. Even at a slightly lower rate, total profit goes up."], "#8e24aa"], [["🚚 होम डिलिव्हरी", "₹३०० वर मोफत डिलिव्हरी, त्याखाली ₹२०. सकाळी ८-१० आणि संध्याकाळी ५-७ अशा दोन वेळा ठेवा."], ["🚚 होम डिलीवरी", "₹३०० से ऊपर मुफ़्त डिलीवरी, उससे नीचे ₹२०। दिन में दो समय रखें: सुबह ८-१० और शाम ५-७।"], ["🚚 Home delivery", "Free delivery above ₹300, ₹20 below that. Keep two slots: 8-10 am and 5-7 pm."], "#e53935"], [["🎁 लॉयल्टी", "१० वेळा खरेदी केली की लिंबू किंवा कोथिंबीर मोफत. नियमित ग्राहक टिकतात, आणि लिंबू/कोथिंबिरीचा खर्च कमी असतो."], ["🎁 लॉयल्टी", "१० बार ख़रीदारी पर नींबू या धनिया मुफ़्त। नियमित ग्राहक टिकते हैं, और नींबू/धनिया का ख़र्च कम होता है।"], ["🎁 Loyalty", "Free lemon or coriander after 10 purchases. Regular customers stay, and lemon/coriander cost very little."], "#00897b"], [["⭐ ३ ग्राहक-ओढणारे + ३ नफा-देणारे माल", "बटाटा, कांदा, टोमॅटो यावर नफा कमी ठेवा, ते ग्राहकाला आणतात. कोथिंबीर, लिंबू, मिरची, आलं यावर नफा जास्त ठेवा, ते बिल वाढवतात."], ["⭐ ३ ग्राहक-खींचने वाले + ३ मुनाफ़ा देने वाले माल", "आलू, प्याज़, टमाटर पर मुनाफ़ा कम रखें, वे ग्राहक को लाते हैं। धनिया, नींबू, मिर्च, अदरक पर मुनाफ़ा ज़्यादा रखें, वे बिल बढ़ाते हैं।"], ["⭐ 3 customer-pullers + 3 profit-makers", "Keep profit low on potato, onion, tomato; they bring customers in. Keep profit higher on coriander, lemon, chilli, ginger; they raise the bill."], "#6d4c41"]];

var SEG=[[["🏢 सोसायटी / अपार्टमेंट", "सेक्रेटरी किंवा चेअरमनला भेटा आणि सोसायटीच्या WhatsApp ग्रुपवर रोजचे भाव टाकायची परवानगी घ्या. ५-१० घरं मिळाली तरी रोज ऑर्डर येतात. सोसायटीसाठी खास पॅक ऑफर द्या.", "नमस्कार! आमच्याकडे ताजी भाजी थेट मंडईतून, रोजचे कमी भाव. सोसायटीसाठी खास पॅक ऑफर आहे. ऑर्डर आदल्या रात्री ९ पर्यंत, घरपोच सेवा."], ["🏢 सोसायटी / अपार्टमेंट", "सेक्रेटरी या चेयरमैन से मिलें और सोसायटी के WhatsApp ग्रुप पर रोज़ के भाव डालने की इजाज़त लें। ५-१० घर मिल जाएँ तो रोज़ ऑर्डर आते हैं। सोसायटी के लिए ख़ास पैक ऑफ़र दें।", "नमस्ते! हमारे पास ताज़ी सब्ज़ी सीधे मंडी से, रोज़ कम भाव। सोसायटी के लिए ख़ास पैक ऑफ़र है। ऑर्डर पिछली रात ९ बजे तक, घर तक डिलीवरी।"], ["🏢 Housing societies / apartments", "Meet the secretary or chairman and get permission to post daily rates in the society WhatsApp group. Even 5-10 homes give you daily orders. Offer a special society pack.", "Hello! Fresh vegetables straight from the market at low daily rates. We have a special pack offer for the society. Order by 9 pm the night before, home delivery available."]], [["🏠 PG / हॉस्टेल / मेस", "मेस आणि PG चालवणारे आठवड्याचा माल एकदम घेतात. ठरलेला आठवड्याचा भाव आणि वेळेवर डिलिव्हरी द्या.", "नमस्कार! मेस/PG साठी आठवड्याचे ठरलेले भाव आणि वेळेवर डिलिव्हरी. आजच्या भावाची यादी पाठवू का?"], ["🏠 PG / हॉस्टल / मेस", "मेस और PG चलाने वाले हफ़्ते का माल एक साथ लेते हैं। तय हफ़्ते का भाव और समय पर डिलीवरी दें।", "नमस्ते! मेस/PG के लिए हफ़्ते के तय भाव और समय पर डिलीवरी। आज के भाव की सूची भेजूँ?"], ["🏠 PG / hostels / mess", "Mess and PG owners buy a week's stock at once. Offer a fixed weekly rate and on-time delivery.", "Hello! Fixed weekly rates and on-time delivery for your mess/PG. Shall I send today's rate list?"]], [["🍱 टिफिन सेवा / कॅन्टीन", "रोजचा ठरलेला माल लागतो. सकाळी लवकर डिलिव्हरी आणि रोजचा ठरलेला भाव द्या. एक टिफिन सेवा मिळाली तरी रोजचा मोठा ऑर्डर.", "नमस्कार! टिफिन सेवेसाठी रोज सकाळी ताजी भाजी, ठरलेला कमी भाव. एकदा ट्रायल ऑर्डर घ्या."], ["🍱 टिफ़िन सेवा / कैंटीन", "रोज़ का तय माल लगता है। सुबह जल्दी डिलीवरी और रोज़ का तय भाव दें। एक टिफ़िन सेवा मिल जाए तो रोज़ का बड़ा ऑर्डर।", "नमस्ते! टिफ़िन सेवा के लिए रोज़ सुबह ताज़ी सब्ज़ी, तय कम भाव। एक बार ट्रायल ऑर्डर लें।"], ["🍱 Tiffin services / canteens", "They need fixed stock daily. Offer early-morning delivery at a fixed daily rate. One tiffin service means a big daily order.", "Hello! Fresh vegetables every morning at a fixed low rate for your tiffin service. Please try one trial order."]], [["🍛 खानावळ / हॉटेल / ठेले", "कांदा, बटाटा, टोमॅटो, मिरची रोज लागतात. मोठ्या प्रमाणावर थोडा कमी भाव द्या, पण रोज ऑर्डर घ्या.", "नमस्कार! हॉटेलसाठी कांदा-बटाटा-टोमॅटो रोज ताजे, मोठ्या ऑर्डरवर खास भाव. आज भाव कळवू का?"], ["🍛 खानावळ / होटल / ठेले", "प्याज़, आलू, टमाटर, मिर्च रोज़ लगते हैं। बड़ी मात्रा पर थोड़ा कम भाव दें, पर रोज़ ऑर्डर लें।", "नमस्ते! होटल के लिए प्याज़-आलू-टमाटर रोज़ ताज़े, बड़े ऑर्डर पर ख़ास भाव। आज भाव बताऊँ?"], ["🍛 Eateries / hotels / street stalls", "Onion, potato, tomato and chilli are needed daily. Give a slightly lower rate on large quantities, but take daily orders.", "Hello! Fresh onion, potato and tomato daily for your hotel, special rate on big orders. Shall I tell you today's rates?"]], [["💼 ऑफिस / कंपनी कॅन्टीन", "कॅन्टीन चालवणारे ठेकेदार आठवड्याचा ऑर्डर देतात. आधी एकदा नमुना द्या आणि मग ठरलेला भाव.", "नमस्कार! कॅन्टीनसाठी रोज ताजी भाजी वेळेवर. आठवड्याचा ठरलेला भाव देतो. भेटू शकतो का?"], ["💼 ऑफ़िस / कंपनी कैंटीन", "कैंटीन चलाने वाले ठेकेदार हफ़्ते का ऑर्डर देते हैं। पहले एक बार नमूना दें और फिर तय भाव।", "नमस्ते! कैंटीन के लिए रोज़ ताज़ी सब्ज़ी समय पर। हफ़्ते का तय भाव देता हूँ। मिल सकते हैं?"], ["💼 Offices / company canteens", "Canteen contractors place weekly orders. Give a sample first, then a fixed rate.", "Hello! Fresh vegetables daily on time for your canteen, with a fixed weekly rate. Can we meet?"]], [["🎉 केटरर / लग्न-कार्यालय / पूजा", "कार्यक्रमासाठी एकदम मोठा माल लागतो. आधी ऑर्डर घ्या, भाव आधी ठरवा आणि वेळेवर डिलिव्हरी द्या.", "नमस्कार! कार्यक्रमासाठी मोठ्या प्रमाणावर भाजी, ठरलेला भाव आणि वेळेवर डिलिव्हरी. तारीख कळवा."], ["🎉 केटरर / शादी-हॉल / पूजा", "कार्यक्रम के लिए एक साथ बड़ा माल चाहिए। पहले ऑर्डर लें, भाव पहले तय करें और समय पर डिलीवरी दें।", "नमस्ते! कार्यक्रम के लिए बड़ी मात्रा में सब्ज़ी, तय भाव और समय पर डिलीवरी। तारीख़ बताएँ।"], ["🎉 Caterers / wedding halls / pujas", "Events need a big quantity at once. Take the order early, fix the rate first and deliver on time.", "Hello! Vegetables in bulk for your event at a fixed rate with on-time delivery. Please tell us the date."]], [["👩‍👩‍👧 महिला बचत गट / भिशी ग्रुप", "ग्रुपच्या WhatsApp वर आठवड्याचे पॅक सांगा. ग्रुप ऑर्डर आली की एकाच ठिकाणी घरपोच द्या, एका ग्रुपमधून ५-१० ग्राहक.", "नमस्कार ताई! आपल्या ग्रुपसाठी आठवड्याचा खास भाजी पॅक, बाजारापेक्षा स्वस्त. ग्रुप ऑर्डरवर घरपोच."], ["👩‍👩‍👧 महिला बचत समूह / भीसी ग्रुप", "ग्रुप के WhatsApp पर हफ़्ते के पैक बताएँ। ग्रुप ऑर्डर आए तो एक ही जगह पहुँचा दें, एक ग्रुप से ५-१० ग्राहक।", "नमस्ते दीदी! आपके ग्रुप के लिए हफ़्ते का ख़ास सब्ज़ी पैक, बाज़ार से सस्ता। ग्रुप ऑर्डर पर घर तक डिलीवरी।"], ["👩‍👩‍👧 Women's self-help groups / kitty groups", "Tell the group on WhatsApp about weekly packs. Deliver a group order to one place; one group can give 5-10 customers.", "Hello! A special weekly vegetable pack for your group, cheaper than the market. Delivery on group orders."]], [["🧑‍🤝‍🧑 शेजारी / नातेवाईक / ओळखीचे", "पहिल्या १० ग्राहकांसाठी \"ओळखीचा भाव\" ठेवा. प्रत्येकाला दोन ओळखी सांगायला सांगा. सगळ्यात सोपा आणि लवकर मिळणारा मार्ग.", "नमस्कार! आम्ही भाजीचं काम सुरू केलं आहे. ओळखीच्यांसाठी खास भाव, घरपोच. दोन ओळखीच्यांना सांगाल का?"], ["🧑‍🤝‍🧑 पड़ोसी / रिश्तेदार / जान-पहचान", "पहले १० ग्राहकों के लिए \"जान-पहचान का भाव\" रखें। हर एक से दो और लोगों को बताने को कहें। सबसे आसान और जल्दी मिलने वाला रास्ता।", "नमस्ते! हमने सब्ज़ी का काम शुरू किया है। जान-पहचान वालों के लिए ख़ास भाव, घर तक डिलीवरी। दो और लोगों को बताएँगे?"], ["🧑‍🤝‍🧑 Neighbours / relatives / acquaintances", "Keep a \"friends and family rate\" for the first 10 customers. Ask each to tell two more people.
